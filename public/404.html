<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA 重定向腳本
    const path = window.location.pathname;
    const repoName = "/glow-tour";
    if (path.startsWith(repoName)) {
      sessionStorage.setItem("spaRedirectPath", path);
      window.location.href = repoName + "/";
    }
  </script>
</head>
<body>
</body>
</html>
